name: Release

# Publishes the package to NuGet.org when a version tag is pushed, e.g. v3.0.0 or v3.1.0-beta1
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  PROJECT: src/Oracle.Dapper.NetCore/Oracle.Dapper.NetCore.csproj

jobs:
  release:
    name: Publish to NuGet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Resolve version from tag
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore
        run: dotnet restore Oracle.Dapper.NetCore.sln

      - name: Build
        run: dotnet build Oracle.Dapper.NetCore.sln -c Release --no-restore -warnaserror -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test Oracle.Dapper.NetCore.sln -c Release --no-build

      - name: Pack
        run: dotnet pack ${{ env.PROJECT }} -c Release --no-build -o artifacts -p:Version=${{ steps.version.outputs.version }}

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: artifacts/*.nupkg
          if-no-files-found: error

      - name: Push to NuGet.org
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--title "${GITHUB_REF_NAME}" --generate-notes --verify-tag)
          if [[ "${{ steps.version.outputs.prerelease }}" == "true" ]]; then
            flags+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" artifacts/*.nupkg "${flags[@]}"
